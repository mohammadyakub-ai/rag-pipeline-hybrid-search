[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
# This host has ROS/ament plugins (launch_testing, launch_ros) registered as
# pytest entry points that are incompatible with pytest >= 8. They are no-ops
# when absent, so these flags are safe to keep on any machine.
addopts = -p no:launch_testing -p no:launch_ros